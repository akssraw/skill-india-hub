<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Skill India Hub — Empowering India's Youth Through Skills</title>
    <meta name="description" content="India's premier platform connecting youth with vocational training, internships, certifications and employment opportunities under the Skill India Mission." />
    <meta name="keywords" content="Skill India, PMKVY, NSDC, vocational training, internships, apprenticeship, India youth, skill development, career roadmaps" />
    <meta name="author" content="National Skill Development Corporation" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://skillindiahub.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skillindiahub.in/" />
    <meta property="og:title" content="Skill India Hub — Empowering India's Youth Through Skills" />
    <meta property="og:description" content="Find internships, training programs, certifications and step-by-step career roadmaps under the Skill India Mission." />
    <meta property="og:image" content="https://skillindiahub.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Skill India Hub" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@skillindiahub" />
    <meta name="twitter:title" content="Skill India Hub — Empowering India's Youth" />
    <meta name="twitter:description" content="Join 1.45 crore+ youth trained under Skill India. Explore internships, roadmaps and certifications." />
    <meta name="twitter:image" content="https://skillindiahub.in/og-image.jpg" />

    <!-- Mobile & PWA -->
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Skill India Hub" />

    <!-- Inline SVG favicon — no file needed -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2310b981'/><path d='M50 20L65 50H35z' fill='white'/><rect x='35' y='55' width='30' height='6' rx='3' fill='white'/><rect x='40' y='67' width='20' height='6' rx='3' fill='white'/></svg>" />

    <!-- Google Fonts — preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Noscript fallback -->
    <noscript>
      <style>body { font-family: sans-serif; padding: 2rem; text-align: center; }</style>
    </noscript>
